services:
  postgres:
    image: postgres:17
    container_name: getaway-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: getaway
      POSTGRES_USER: getaway
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: